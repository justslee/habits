services:
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: habits-graphhopper
    ports:
      - "8989:8989"
    volumes:
      - ./graphhopper-data:/data
    environment:
      JAVA_OPTS: "-Xmx1g -Xms256m"
    command: >
      -c /data/config.yml
    restart: unless-stopped
