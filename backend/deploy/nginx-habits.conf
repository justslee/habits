# Habits API — host-based server block co-located with scorecard's nginx.
# TLS terminates at the ALB; the box serves plain HTTP:80 (ALB SG only).
# Install to /etc/nginx/sites-available/habits and symlink into sites-enabled.
server {
    listen 80;
    server_name habits.looperapp.org;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        access_log off;
    }
}
