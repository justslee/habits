graphhopper:
  datareader.file: /data/region.osm.pbf
  graph.location: /data/graph-cache

  graph.encoded_values: foot_access,foot_average_speed,road_access,road_class,road_environment,surface

  profiles:
    - name: foot
      custom_model:
        priority:
          - if: "!foot_access"
            multiply_by: "0"
        speed:
          - if: "true"
            limit_to: "foot_average_speed"

  # CH disabled — needed for round_trip algorithm
  # profiles_ch:
  #   - profile: foot

  import.osm.ignored_highways: motorway,trunk

  prepare.min_network_size: 200

server:
  application_connectors:
    - type: http
      port: 8989
