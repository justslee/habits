<div id="habits-liquid" aria-label="Habits · liquid design" data-look="auto" data-motion="fluid">

<script>
(()=>{
const root=document.getElementById('habits-liquid');
const stage=root.querySelector('.h-stage'),nav=root.querySelector('.h-nav'),layer=root.querySelector('.h-sheet-layer'),toastEl=root.querySelector('.h-toast'),live=root.querySelector('.h-live');
const design={appearance:'auto',motion:'fluid',sculpture:true};
const state={tab:'daily',habits:[true,false,false],task:false,food:'home',pantry:['Have','Low','Have','Need'],deck:0,kept:[],history:[],store:0,cartReady:false,paid:false,session:false,exercise:0,sets:0,weight:45,reps:8,rest:0,minutes:45,pendingMinutes:45,selectedDay:3,voice:false,voiceFinished:false,assistantAnswer:false,taste:[true,true,true,false]};
const tabs=[['daily','sun','Daily'],['train','dumbbell','Train'],['speak','audio-lines','Speak'],['north','sparkles','North'],['food','utensils','Food'],['me','user-round','Me']];
const meals=[
 {title:'Dakdoritang',kr:'닭도리탕',source:'Maangchi',url:'https://www.maangchi.com/recipe/dakdoritang',desc:'Spicy chicken stew. Even better the next day.',reason:'Uses your gochujang. One pot, six portions.',prep:'20 min',protein:'42 g',servings:6},
 {title:'Sundubu jjigae',kr:'순두부찌개',source:'Maangchi',url:'https://www.maangchi.com/recipe/sundubu-jjigae',desc:'Your familiar soft tofu soup, ready in a few minutes.',reason:'Cook the base once. Add fresh tofu when reheating.',prep:'15 min',protein:'34 g',servings:6},
 {title:'Bulgogi bowls',kr:'불고기',source:'Maangchi',url:'https://www.maangchi.com/recipe/bulgogi',desc:'Tender beef, rice, and a quick pan reheat.',reason:'Shares scallions and mushrooms with your soups.',prep:'20 min',protein:'41 g',servings:6},
 {title:'Dakgalbi',kr:'닭갈비',source:'Maangchi',url:'https://www.maangchi.com/recipe/dakgalbi',desc:'Spicy chicken and cabbage, all in one pan.',reason:'A familiar favorite. Uses the same sauce staples.',prep:'20 min',protein:'43 g',servings:6},
 {title:'Oyakodon',kr:'親子丼',source:'Just One Cookbook',url:'https://www.justonecookbook.com/oyakodon/',desc:'Chicken and egg over rice. Simple comfort.',reason:'A gentler flavor, with ingredients you already use.',prep:'15 min',protein:'36 g',servings:6}
];
const stores=[{name:'Wegmans',via:'DoorDash',total:84.60,subtotal:78.60,fees:4,tip:12,deal:10,note:'Best sample total · $10 offer applied'}, {name:'H Mart Manhattan',via:'H Mart',total:91.40,subtotal:76.40,fees:5,tip:10,deal:0,note:'Korean staples · all items in one cart'}, {name:'Whole Foods Market',via:'Amazon',total:96.80,subtotal:82.80,fees:4,tip:10,deal:0,note:'Organic produce options · one delivery'}];
const exercises=['Dumbbell bench press','One-arm dumbbell row','Half-kneeling landmine press','Cable face pull','Pallof press','Farmer carry'];
let toastTimer,undoAction=null,restTimer=null,voiceTimer=null,lastFocus=null,gesture=null,suppressUntil=0;
const I=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const money=n=>'$'+n.toFixed(2);
const button=(label,act,kind='h-primary',attrs='')=>`<button type="button" class="${kind}" data-act="${act}" ${attrs}>${label}</button>`;
const top=(label,action='profile')=>`<div class="h-top"><span class="h-eyebrow">${label}</span><button class="h-avatar" data-act="${action}" aria-label="Open your profile">J</button></div>`;
const flow=(step,back)=>`<div class="h-flow-top">${button(I('arrow-left'),back,'h-icon','aria-label="Back"')}<span class="h-flow-step">${step}</span></div>`;
const sculpture=()=>`<div class="h-sculpture" aria-hidden="true" ${design.sculpture?'':'hidden'}></div>`;
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
function announce(s){live.textContent=s}
function toast(msg,undo){clearTimeout(toastTimer);undoAction=undo||null;toastEl.innerHTML=`<span>${msg}</span>${button(undo?'Undo':'Dismiss',undo?'undo':'toast-close','')}`;toastEl.hidden=false;announce(msg);toastTimer=setTimeout(()=>{toastEl.hidden=true;undoAction=null},6000)}
function applyDesign(){root.dataset.look=design.appearance;root.dataset.motion=design.motion;root.querySelectorAll('.h-sculpture').forEach(el=>el.hidden=!design.sculpture)}
function render(animate=true){
 const views={daily:daily,train:train,speak:speak,north:north,food:food,me:me};
 stage.innerHTML=`<div class="${animate?'h-enter':''}">${views[state.tab]()}</div>`;
 nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===state.tab?'page':'false'));
 nav.querySelector('.h-nav-selection').style.transform=`translateX(${tabs.findIndex(t=>t[0]===state.tab)*100}%)`;
 root.querySelector('#habits-assistant-label').textContent={daily:'A little help with your day',train:'Ask your training coach',food:'Your kitchen, taken care of',speak:'Talk it through',north:'Make space for what matters',me:'What should I remember?'}[state.tab];
 applyDesign();icons();
}
function daily(){return `${top('Thursday, September 10')}<h1 class="h-title h-daily-title">Morning, <em>Justin.</em></h1><div class="h-hero h-daily-hero" data-hold="adjust">${sculpture()}<div class="h-eyebrow">Your next good thing</div><h2 class="h-subtitle">A stronger body.<br>A clearer mind.</h2><p class="h-body">Strength A · ${state.minutes} minutes</p><div class="h-hero-bottom">${button(`Start session ${I('arrow-up-right')}`,'start-workout')}${button(I('ellipsis'),'adjust','h-icon','aria-label="Adjust today’s workout"')}</div></div><div class="h-section"><h2>Daily rituals</h2><span class="h-small">${state.habits.filter(Boolean).length} of 3 done</span></div>${['Morning walk','Read for 20 minutes','Take creatine'].map((name,i)=>`<div class="h-habit-shell"><span class="h-swipe-label" aria-hidden="true">${state.habits[i]?'Undo':'Done'} ${I('check')}</span><button class="h-habit" data-habit="${i}" aria-pressed="${state.habits[i]}" aria-label="${name}, ${state.habits[i]?'completed':'not completed'}"><span class="h-check">${state.habits[i]?I('check'):''}</span><span><span class="h-habit-title">${name}</span><span class="h-habit-sub">${['A little daylight','One chapter at a time','Make it effortless'][i]}</span></span><span class="h-habit-tail">${['12 days','5 days','8 days'][i]}</span></button>${button(I('ellipsis'),'habit-options-'+i,'h-habit-more','aria-label="Options for '+name+'"')}</div>`).join('')}<p class="h-hint">Swipe to complete · hold for options</p><div class="h-section h-focus-section"><span class="h-eyebrow">One thing that matters</span></div><button class="h-task" data-act="task" aria-pressed="${state.task}">${I(state.task?'circle-check':'circle')}<span>${state.task?'Food experience shipped':'Ship the Food experience'}</span><span>45 min</span></button>`}
function movementCount(){return state.minutes===45?6:state.minutes===30?4:3}
function train(){
 const header=top('Train · Golf performance');
 if(state.session)return `${header}${flow('Strength A · '+(state.exercise+1)+' of '+movementCount()+' moves','leave-workout')}<h1 class="h-title">Find your<br><em>rhythm.</em></h1><section class="h-session"><div class="h-eyebrow">${state.sets===3?'Exercise complete':'Set '+(state.sets+1)+' of 3'}</div><h2 class="h-subtitle">${exercises[state.exercise]}</h2><p class="h-body" style="margin-top:9px">Last session · 45 lb × 8, 8, 7</p><div class="h-set-track">${[0,1,2].map(i=>`<span class="${state.sets>i?'done':''}"></span>`).join('')}</div><div class="h-step-fields">${[['weight','Weight · lb',state.weight],['reps','Reps',state.reps]].map(([key,label,val])=>`<div class="h-step-field"><label>${label}</label><div class="h-stepper">${button('−',key+'-down','','aria-label="Decrease '+key+'"')}<output>${val}</output>${button('+',key+'-up','','aria-label="Increase '+key+'"')}</div></div>`).join('')}</div>${state.rest?`<div class="h-rest"><span>Rest <strong id="habits-rest">${state.rest}s</strong></span>${button('Skip rest','skip-rest','h-quiet')}</div>`:''}${button(state.sets===3?(state.exercise===movementCount()-1?'Finish session':'Next exercise '+I('arrow-right')):(I('check')+' Log set '+(state.sets+1)),state.sets===3?'next-exercise':'log-set','h-primary h-full',state.rest?'disabled':'')}</section><div class="h-section"><h2>Stay in the flow</h2></div><p class="h-body">Log here. Rest here. Your next set is already ready.</p>${button('Adjust this session','adjust','h-quiet h-full')}`;
 return `${header}<h1 class="h-title">Build strength.<br><em>Keep your edge.</em></h1><div class="h-week">${['M','T','W','T','F','S','S'].map((d,i)=>`<button class="h-day" data-day="${i}" aria-label="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}, September ${7+i}" aria-pressed="${state.selectedDay===i}"><span>${d}</span><strong>${7+i}</strong></button>`).join('')}</div><div class="h-hero" data-hold="adjust">${sculpture()}<div class="h-eyebrow">${state.selectedDay===3?'Today · Foundation, week 3':'This week · Foundation'}</div><h2 class="h-subtitle">${state.selectedDay%2===0?'Easy miles.':'Strength A.'}<br>Long-term gains.</h2><p class="h-body">${state.selectedDay%2===0?'30 min · conversational pace':state.minutes+' min · '+movementCount()+' movements'}</p><div class="h-hero-bottom">${button(state.selectedDay%2===0?'Preview run':'Start session',state.selectedDay%2===0?'run':'start-workout')}${button(I('sliders-horizontal'),'adjust','h-icon','aria-label="Adjust session"')}</div></div><div class="h-section"><h2>The bigger picture</h2></div><button class="h-goal" data-act="program"><span><b>From foundation to fairway</b><span class="h-small">Your program · September → spring</span></span>${I('arrow-up-right')}</button><button class="h-goal" data-act="training-history"><span><b>Small wins, adding up</b><span class="h-small">Training history & progress</span></span>${I('arrow-up-right')}</button><p class="h-hint">Hold the session to make it fit your day</p>`}
function food(){
 const f=state.food;
 if(f==='home')return `${top('Food · Your two-week kitchen')}<h1 class="h-title">Eat well.<br><em>Think less.</em></h1><div class="h-food-cover"><span class="h-eyebrow">Tonight · from your last plan</span><h2 class="h-subtitle">A little heat.<br>A lot of comfort.</h2><div class="h-bowl" aria-hidden="true"></div><p class="h-small" style="margin-top:12px">Dakdoritang · reheat in a pan</p></div><div class="h-plan-summary"><div class="h-row"><span class="h-eyebrow">September 10–23</span><span class="h-badge">${state.paid?'Purchased':state.kept.length>=3?'Plan ready':'Next grocery run'}</span></div><h2 class="h-subtitle" style="margin-top:12px">${state.paid?'Your kitchen is covered.':state.kept.length>=3?'Three recipes. All set.':'Nine days to feed you.'}</h2><p class="h-body" style="margin-top:8px">18 lunches & dinners. A few familiar recipes, made in batches.</p><div class="h-calendar-note">${I('calendar-days')}<span>3 days away · 2 days eating out</span></div>${button(state.paid?'See your plan':state.kept.length>=3?'Continue your plan':'Plan my groceries',state.kept.length>=3?'food-plan':'food-pantry','h-primary h-full')}</div><div class="h-section"><h2>The kitchen ledger</h2>${button('View spend '+I('arrow-up-right'),'food-spend','h-inline')}</div><div class="h-row"><span class="h-body">September groceries</span><span style="font-size:22px;font-family:'Instrument Serif',serif">${money(164.30+(state.paid?stores[state.store].total:0))}</span></div><div class="h-section" style="margin-top:12px">${button('Pantry','pantry-only','h-inline')}${button('Taste & recipes','taste','h-inline')}${button('Calendar','calendar','h-inline')}</div>`;
 if(f==='pantry')return `${flow('01 · A quick pantry check','food-home')}<h1 class="h-title">Start with<br><em>what’s here.</em></h1><p class="h-body">Just the ingredients that change this plan.</p>${['Gochujang','Rice','Soy sauce','Scallions'].map((p,i)=>`<div class="h-pantry-row"><span>${p}</span><button class="h-pantry-state" data-pantry="${i}" data-state="${state.pantry[i]}" aria-label="${p}: ${state.pantry[i]}. Tap to change.">${state.pantry[i]} ${I('chevron-down')}</button></div>`).join('')}<p class="h-small h-space">Tap to cycle: Have → Low → Need</p><div class="h-calendar-note h-space">${I('calendar-days')}<span>Google Calendar · 3 travel days excluded</span></div>${button('Find my meals '+I('arrow-right'),'food-deck','h-primary h-full')}${button('Review travel dates','calendar','h-quiet h-full')}`;
 if(f==='deck'){
 if(state.kept.length>=3)return plan();
 if(state.deck>=meals.length)return `${flow('02 · Your taste, your pace','food-pantry')}<h1 class="h-title">Nothing quite<br><em>right?</em></h1><p class="h-body">${state.kept.length} recipe${state.kept.length===1?'':'s'} kept. Revisit the skipped meals or adjust what you’re in the mood for.</p><div class="h-space">${button('Revisit skipped meals','deck-revisit','h-primary h-full')}${button('Adjust preferences','taste','h-quiet h-full')}</div>`;
 const m=meals[state.deck];return `${flow('02 · Find your familiar favorites','food-pantry')}<div class="h-row"><h1 class="h-title" style="margin-bottom:0">A good <em>fit?</em></h1><span class="h-small">${state.kept.length*6} / 18 servings</span></div><div class="h-coverage">${Array.from({length:9},(_,i)=>`<span class="${i<state.kept.length*3?'on':''}"></span>`).join('')}</div><div class="h-recipe-stack"><article class="h-recipe" data-deck="true" aria-label="${m.title} recipe"><div class="h-recipe-art"><span class="h-eyebrow">${m.source} · recipe inspiration</span><strong>${m.kr}</strong><div class="h-bowl" aria-hidden="true"></div></div><div class="h-recipe-body"><h2>${m.title}</h2><p class="h-body">${m.desc}</p><span class="h-badge">${I('recycle')} ${state.deck===0?'Uses pantry staples':state.deck===1?'A familiar favorite':'Shared ingredients'}</span><div class="h-recipe-stat" style="margin-top:16px"><span><b>${m.prep}</b>active prep</span><span><b>${m.protein}</b>protein*</span><span><b>6</b>servings*</span></div></div></article></div><div class="h-deck-actions">${button(I('x')+' Not this time','deck-skip','h-secondary')}${button(I('check')+' Yes, please','deck-keep')}</div><div class="h-row">${button(I('undo-2')+' Undo','deck-undo','h-quiet',state.history.length?'':'disabled')}${button('Recipe details '+I('arrow-up-right'),'recipe-details','h-quiet')}</div><p class="h-small">*Illustrative portions and nutrition for this preview.</p>`;
 }

function me(){return `${top('Me · Your space')}<div class="h-avatar" style="width:64px;height:64px;display:grid;place-items:center;font-size:36px;margin:10px 0 19px">J</div><h1 class="h-title">A little more<br><em>like you.</em></h1><p class="h-body">Your preferences, memories, and connections.</p><div class="h-section"><h2>What Habits knows</h2></div>${[['Food & cooking','Korean, Japanese · efficient meal prep','taste'],['Training','Strength, golf & steady progress','program'],['Calendar','Google Calendar · sample connection','calendar'],['Assistant memory','You choose what stays','memory'],['Appearance',design.appearance==='auto'?'Follows your device':design.appearance==='ink'?'Deep ink':'Soft pearl','appearance']].map(([title,sub,act])=>`<button class="h-goal" data-act="${act}"><span><b>${title}</b><span class="h-small">${sub}</span></span>${I('chevron-right')}</button>`).join('')}<div class="h-notice">${I('laptop')}<span>Designed for your personal Mac server.<br>This prototype runs entirely on sample data.</span></div>`}
function openSheet(title,body){toastEl.hidden=true;clearTimeout(toastTimer);lastFocus=document.activeElement;stage.inert=true;root.querySelector('.h-footer').inert=true;layer.hidden=false;layer.innerHTML=`<section class="h-sheet" role="dialog" aria-modal="true" aria-label="${title.replace(/<[^>]*>/g,' ')}"><button class="h-sheet-handle" data-act="close" aria-label="Close sheet"></button><div class="h-sheet-head"><h2>${title}</h2>${button(I('x'),'close','h-icon','aria-label="Close"')}</div>${body}</section>`;icons();layer.querySelector('[data-act=close]').focus();}

function showAssistant(answer=false){state.assistantAnswer=answer;openSheet('A little help.',`<p class="h-body">${state.tab==='train'?'Your coach, right where you need it.':state.tab==='food'?'Meals, pantry, preferences. All in context.':'Make your day fit the life you want.'}</p>${answer?`<div class="h-assistant-answer"><strong>You have a busy day. Let’s make it lighter.</strong><p style="margin-top:8px">Shorten Strength A to 30 minutes, keep the main lifts, and leave dinner to your meal prep.</p></div>${button('Apply the 30-minute session','assistant-apply','h-primary h-full')}`:`<div class="h-options">${button('I only have 30 minutes','assistant-sample','')}${button('Help with dinner','assistant-dinner','')}</div><form id="habits-ask"><label class="h-small" for="habits-prompt">Ask your assistant</label><input id="habits-prompt" class="h-input" placeholder="What’s on your mind?" autocomplete="off"><button class="h-primary h-full" type="submit">Preview a reply ${I('arrow-up')}</button></form>`}<p class="h-small" style="margin-top:14px">Scripted preview · no message is sent</p>`)}

function chooseRecipe(keep){if(deckBusy)return;const card=stage.querySelector('.h-recipe');const reduced=design.motion==='quiet'||matchMedia('(prefers-reduced-motion: reduce)').matches;if(card&&!reduced){deckBusy=true;card.animate([{transform:'translateX(0) rotate(0deg)',opacity:1},{transform:'translateX('+(keep?'110':'-110')+'px) rotate('+(keep?'9':'-9')+'deg)',opacity:0}],{duration:190,easing:'ease-in',fill:'forwards'}).finished.then(()=>{deckBusy=false;commitRecipe(keep)});return}commitRecipe(keep)}
function commitRecipe(keep){if(state.deck>=meals.length||state.kept.length>=3)return;state.history.push({deck:state.deck,kept:[...state.kept]});if(keep)state.kept.push(state.deck);const label=meals[state.deck].title;do{state.deck++}while(state.kept.includes(state.deck));if(state.kept.length>=3){state.food='plan';announce('18 servings covered. Your plan is ready.')}else announce(keep?label+' kept. '+state.kept.length*6+' of 18 servings covered.':label+' skipped this time.');render();}

 if(a==='schedule'){openSheet('Cook a little. Coast a little.',`<div class="h-detail-row"><span>Session one · Sep 10<span class="h-small">First two recipes · freeze later portions</span></span>45 min</div><div class="h-detail-row"><span>Travel · Sep 15–17<span class="h-small">No meals planned</span></span>${I('plane')}</div><div class="h-detail-row"><span>Session two · Sep 18<span class="h-small">Third recipe · use the frozen protein</span></span>25 min</div><p class="h-body" style="margin-top:16px">The finished planner will attach recipe-specific cooling, storage and thawing instructions.</p>`);return}

 if(a==='appearance'){openSheet('Your kind of calm.',`<p class="h-body">The same Habits, in a different light.</p><div class="h-options">${[['auto','Device'],['pearl','Pearl'],['ink','Ink']].map(([key,label])=>`<button data-appearance="${key}" aria-pressed="${design.appearance===key}">${label}</button>`).join('')}</div>${button('Done','close','h-primary h-full')}`);return}
 if(a==='memory'){openSheet('Remember with intention.',`<p class="h-body">You can see, correct, and remove what the assistant remembers.</p><div class="h-detail-row"><span>Food preferences<span class="h-small">Korean & Japanese · minimal prep</span></span>${I('check')}</div><div class="h-detail-row"><span>Your priorities<span class="h-small">More time for personal projects</span></span>${I('check')}</div><p class="h-small" style="margin-top:16px">These are sample memories based on this design brief. No new memory is saved by this prototype.</p>`);return}
 if(a.startsWith('habit-options-')){const i=Number(a.slice(14));openSheet(['Morning walk','Read for 20 minutes','Take creatine'][i],`<p class="h-body">An easy action for today.</p><div class="h-space">${button(state.habits[i]?'Mark incomplete':'Mark complete','habit-toggle-'+i,'h-primary h-full')}${button('Snooze until tonight','habit-snooze','h-quiet h-full')}</div>`);return}
 if(a.startsWith('habit-toggle-')){const i=Number(a.slice(13));closeSheet();toggleHabit(i);return}if(a==='habit-snooze'){closeSheet();toast('Snoozed until tonight in this preview.');return}
}
nav.insertAdjacentHTML('beforeend',tabs.map(([key,icon,label])=>`<button data-tab="${key}" aria-label="${key==='north'?'North Star':label}">${I(icon)}<span>${label}</span></button>`).join(''));
root.addEventListener('click',e=>{if(performance.now()<suppressUntil){e.preventDefault();return}const t=e.target.closest('button');if(!t)return;if(t.dataset.tab){goTab(t.dataset.tab);return}if(t.dataset.habit!==undefined){toggleHabit(Number(t.dataset.habit));return}if(t.dataset.pantry!==undefined){const i=Number(t.dataset.pantry);const values=['Have','Low','Need'];state.pantry[i]=values[(values.indexOf(state.pantry[i])+1)%3];render(false);announce(t.getAttribute('aria-label').split(':')[0]+' marked '+state.pantry[i]);return}if(t.dataset.day!==undefined){state.selectedDay=Number(t.dataset.day);render(false);return}if(t.dataset.store!==undefined){state.store=Number(t.dataset.store);state.cartReady=false;render(false);return}if(t.dataset.minutes){state.pendingMinutes=Number(t.dataset.minutes);layer.querySelectorAll('[data-minutes]').forEach(b=>b.setAttribute('aria-pressed',b===t));layer.querySelector('#habits-adjust-preview').textContent=state.pendingMinutes===45?'Your full session: 6 movements.':state.pendingMinutes===30?'Main lifts + one accessory. About 30 minutes.':'Main lifts only. About 20 minutes.';return}if(t.dataset.appearance){design.appearance=t.dataset.appearance;applyDesign();layer.querySelectorAll('[data-appearance]').forEach(b=>b.setAttribute('aria-pressed',b===t));render(false);return}if(t.dataset.taste){state.taste[['Korean','Japanese','One-pot meals','New flavors'].indexOf(t.dataset.taste)]=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');announce('Preference changed in preview.');return}if(t.dataset.act)act(t.dataset.act)});
root.addEventListener('submit',e=>{if(e.target.id==='habits-ask'){e.preventDefault();const value=e.target.querySelector('input').value.trim();if(!value){e.target.querySelector('input').focus();return}showAssistant(true)}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!layer.hidden){e.preventDefault();closeSheet()}if(e.key==='Tab'&&!layer.hidden){const focusable=[...layer.querySelectorAll('button:not(:disabled),a[href],input')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
root.addEventListener('pointerdown',e=>{const target=e.target.closest('[data-habit],[data-deck],[data-hold],.h-sheet-handle');if(!target||e.button!==0)return;if(target.hasAttribute('data-hold')&&e.target.closest('button'))return;gesture={target,x:e.clientX,y:e.clientY,dx:0,dy:0,held:false,timer:null};const g=gesture;try{target.setPointerCapture(e.pointerId)}catch{}if(target.dataset.habit!==undefined||target.dataset.hold){g.timer=setTimeout(()=>{if(gesture!==g)return;g.held=true;suppressUntil=performance.now()+500;act(target.dataset.hold||'habit-options-'+target.dataset.habit)},500)}});
root.addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture;g.dx=e.clientX-g.x;g.dy=e.clientY-g.y;if(Math.abs(g.dx)>9||Math.abs(g.dy)>9)clearTimeout(g.timer);if(g.held)return;if(g.target.matches('.h-sheet-handle'))return;if(Math.abs(g.dx)>Math.abs(g.dy)&&Math.abs(g.dx)>8){g.target.style.transition='none';g.target.style.transform=`translateX(${Math.max(-125,Math.min(125,g.dx))}px) rotate(${g.target.dataset.deck?g.dx/19:0}deg)`}});
root.addEventListener('pointerup',e=>{if(!gesture)return;const g=gesture;g.dx=e.clientX-g.x;g.dy=e.clientY-g.y;gesture=null;clearTimeout(g.timer);g.target.style.transition='';g.target.style.transform='';if(g.held){suppressUntil=performance.now()+400;return}if(g.target.matches('.h-sheet-handle')&&g.dy>65){suppressUntil=performance.now()+400;closeSheet();return}if(Math.abs(g.dx)>65&&Math.abs(g.dx)>Math.abs(g.dy)*1.3){suppressUntil=performance.now()+400;if(g.target.dataset.habit!==undefined)toggleHabit(Number(g.target.dataset.habit));if(g.target.dataset.deck)chooseRecipe(g.dx>0)}});
root.addEventListener('pointercancel',()=>{if(gesture){clearTimeout(gesture.timer);gesture.target.style.transform='';gesture.target.style.transition='';gesture=null}});
render(false);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'appearance',{label:'Appearance',options:[{label:'Follow device',value:'auto'},{label:'Pearl',value:'pearl'},{label:'Ink',value:'ink'}]});tweak.addSelect(design,'motion',{label:'Motion',options:[{label:'Fluid',value:'fluid'},{label:'Quiet',value:'quiet'}]});tweak.addToggle(design,'sculpture',{label:'Sculptural highlights'});}
})();
</script>
