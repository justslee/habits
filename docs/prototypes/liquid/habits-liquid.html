 if(state.session)return `${header}${flow('Strength A · '+(state.exercise+1)+' of '+movementCount()+' moves','leave-workout')}<h1 class="h-title">Find your<br><em>rhythm.</em></h1><section class="h-session"><div class="h-eyebrow">${state.sets===3?'Exercise complete':'Set '+(state.sets+1)+' of 3'}</div><h2 class="h-subtitle">${exercises[state.exercise]}</h2><p class="h-body" style="margin-top:9px">Last session · 45 lb × 8, 8, 7</p><div class="h-set-track">${[0,1,2].map(i=>`<span class="${state.sets>i?'done':''}"></span>`).join('')}</div><div class="h-step-fields">${[['weight','Weight · lb',state.weight],['reps','Reps',state.reps]].map(([key,label,val])=>`<div class="h-step-field"><label>${label}</label><div class="h-stepper">${button('−',key+'-down','','aria-label="Decrease '+key+'"')}<output>${val}</output>${button('+',key+'-up','','aria-label="Increase '+key+'"')}</div></div>`).join('')}</div>${state.rest?`<div class="h-rest"><span>Rest <strong id="habits-rest">${state.rest}s</strong></span>${button('Skip rest','skip-rest','h-quiet')}</div>`:''}${button(state.sets===3?(state.exercise===movementCount()-1?'Finish session':'Next exercise '+I('arrow-right')):(I('check')+' Log set '+(state.sets+1)),state.sets===3?'next-exercise':'log-set','h-primary h-full',state.rest?'disabled':'')}</section><div class="h-section"><h2>Stay in the flow</h2></div><p class="h-body">Log here. Rest here. Your next set is already ready.</p>${button('Adjust this session','adjust','h-quiet h-full')}`;
 return `${header}<h1 class="h-title">Build strength.<br><em>Keep your edge.</em></h1><div class="h-week">${['M','T','W','T','F','S','S'].map((d,i)=>`<button class="h-day" data-day="${i}" aria-label="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}, September ${7+i}" aria-pressed="${state.selectedDay===i}"><span>${d}</span><strong>${7+i}</strong></button>`).join('')}</div><div class="h-hero" data-hold="adjust">${sculpture()}<div class="h-eyebrow">${state.selectedDay===3?'Today · Foundation, week 3':'This week · Foundation'}</div><h2 class="h-subtitle">${state.selectedDay%2===0?'Easy miles.':'Strength A.'}<br>Long-term gains.</h2><p class="h-body">${state.selectedDay%2===0?'30 min · conversational pace':state.minutes+' min · '+movementCount()+' movements'}</p><div class="h-hero-bottom">${button(state.selectedDay%2===0?'Preview run':'Start session',state.selectedDay%2===0?'run':'start-workout')}${button(I('sliders-horizontal'),'adjust','h-icon','aria-label="Adjust session"')}</div></div><div class="h-section"><h2>The bigger picture</h2></div><button class="h-goal" data-act="program"><span><b>From foundation to fairway</b><span class="h-small">Your program · September → spring</span></span>${I('arrow-up-right')}</button><button class="h-goal" data-act="training-history"><span><b>Small wins, adding up</b><span class="h-small">Training history & progress</span></span>${I('arrow-up-right')}</button><p class="h-hint">Hold the session to make it fit your day</p>`}
function food(){

 }
 if(f==='plan')return plan();
 if(f==='bags')return `${flow('04 · One good grocery run','food-plan')}<h1 class="h-title">Good ingredients.<br><em>A better basket.</em></h1><p class="h-body">Compare the delivered total. Your pantry staples are already deducted.</p>${stores.map((s,i)=>`<button class="h-store" data-store="${i}" aria-pressed="${state.store===i}"><span>${s.name}<span class="h-small" style="display:block">${s.via}</span></span><strong>${money(s.total)}</strong><span class="h-small">${state.store===i?'✓ ':''}${s.note}</span></button>`).join('')}<p class="h-small h-space">Sample offers and prices · verify in the live cart</p><div class="h-space">${button('Build my cart '+I('arrow-right'),'build-cart','h-primary h-full')}</div><div class="h-notice">${I('shopping-bag')}<span>Cart building stops before checkout. You review every item and the final total.</span></div>`;
 if(f==='review')return review();
 if(f==='receipt')return `${flow('Your grocery run','food-home')}<div class="h-confirm-mark">${I('check')}</div><h1 class="h-title">Taken care of.<br><em>Back to your day.</em></h1><p class="h-body">Demo approval complete. No order was placed and no payment was made.</p><div class="h-receipt"><div class="h-money-row"><span>${stores[state.store].name}</span><span>Sample receipt</span></div><div class="h-money-row total"><span>Recorded in this preview</span><strong>${money(stores[state.store].total)}</strong></div></div><p class="h-body">In the app, spending updates only after a confirmed order receipt.</p><div class="h-space">${button('Back to my meals','food-plan','h-primary h-full')}${button('See grocery spending','food-spend','h-quiet h-full')}</div>`;
 if(f==='spend')return `${flow('The kitchen ledger','food-home')}<h1 class="h-title">Good food.<br><em>Money well spent.</em></h1><div class="h-eyebrow">September · Sample spending</div><div class="h-money">${money(164.30+(state.paid?stores[state.store].total:0))}</div><p class="h-body">${state.paid?3:2} grocery orders · delivery, fees & tips included</p><div class="h-spend-bars" role="img" aria-label="Sample monthly grocery totals: April 228 dollars, May 264, June 249, July 214, August 237, September ${164.30+(state.paid?stores[state.store].total:0)} dollars">${[228,264,249,214,237,164.30+(state.paid?stores[state.store].total:0)].map((n,i)=>`<div class="h-spend-col"><span>$${Math.round(n)}</span><i style="height:${n/3}px"></i><span>${['Apr','May','Jun','Jul','Aug','Sep'][i]}</span></div>`).join('')}</div><div class="h-section"><h2>Receipts</h2><span class="h-small">All-in totals</span></div>${state.paid?`<div class="h-detail-row"><span>${stores[state.store].name}<span class="h-small">Sep 10 · preview approval</span></span><span>${money(stores[state.store].total)}</span></div>`:''}<div class="h-detail-row"><span>H Mart Manhattan<span class="h-small">Sep 3 · 18 items</span></span><span>$88.40</span></div><div class="h-detail-row"><span>Whole Foods Market<span class="h-small">Sep 1 · 12 items</span></span><span>$75.90</span></div>`;
 return '';
}
function plan(){return `${flow('03 · Your two-week plan','food-home')}<div class="h-badge">${I('check')} Enough food. You can stop choosing.</div><h1 class="h-title" style="margin-top:19px">A few favorites.<br><em>More free time.</em></h1><p class="h-body">${state.kept.length} recipes · ${state.kept.length*6} servings · 9 days of lunch & dinner.</p><div class="h-mini-days" role="img" aria-label="14-day plan: 9 eating days, 3 travel days, 2 days eating out">${Array.from({length:14},(_,i)=>`<span class="${[5,6,7].includes(i)?'away':[3,11].includes(i)?'out':''}"></span>`).join('')}</div><div class="h-row"><span class="h-small">Sep 10</span><span class="h-small">Sep 23</span></div><div class="h-plan-list">${state.kept.map((idx,i)=>`<div class="h-plan-meal"><span class="h-index">0${i+1}</span><span>${meals[idx].title}<span class="h-small" style="display:block">6 portions · ${i===1?'freeze the base':'pan reheat'}</span></span>${button(I('ellipsis'),'meal-'+idx,'h-icon','aria-label="Options for '+meals[idx].title+'"')}</div>`).join('')}</div><p class="h-small">Batch in two sessions. Freeze later-week portions; the schedule includes thaw reminders.</p><div class="h-space">${button(state.paid?'View sample receipt':'Find my groceries '+I('arrow-right'),state.paid?'food-receipt':'food-bags','h-primary h-full')}${button('Review the cooking schedule','schedule','h-quiet h-full')}</div>`}
function review(){const s=stores[state.store];return `${flow('05 · Review before paying','food-bags')}<span class="h-badge">${I('shopping-bag')} Cart ready · ${s.via}</span><h1 class="h-title" style="margin-top:18px">Your basket.<br><em>Your call.</em></h1><div class="h-row"><span class="h-body">${s.name}</span>${button('See items','cart-items','h-inline')}</div><div class="h-money">${money(s.total)}</div><span class="h-small">One delivery · all-in sample total</span><div class="h-receipt"><div class="h-money-row"><span>Groceries</span><span>${money(s.subtotal)}</span></div>${s.deal?`<div class="h-money-row"><span>Sample DoorDash offer</span><span>−${money(s.deal)}</span></div>`:''}<div class="h-money-row"><span>Delivery & service</span><span>${money(s.fees)}</span></div><div class="h-money-row"><span>Tip</span><span>${money(s.tip)}</span></div><div class="h-money-row total"><span>Total to approve</span><strong>${money(s.total)}</strong></div></div><div class="h-notice">${I('shield-check')}<span>Approval covers this basket once. A change to items, delivery or price requires your review again.</span></div>${button('Review payment approval '+I('arrow-right'),'payment','h-primary h-full')}${button('Change store','food-bags','h-quiet h-full')}`}
function speak(){return `${top('Speak · Space to think')}<h1 class="h-title">A thought,<br><em>out loud.</em></h1><p class="h-body">Practice a story. Untangle an idea.<br>Or simply get it off your mind.</p><div class="h-voice-stage"><div class="h-voice-orb ${state.voice?'listening':''}" aria-hidden="true"></div><div class="h-wave" aria-hidden="true">${[9,18,12,27,33,19,26,13,23,31,17,10].map((h,i)=>`<i style="height:${state.voice?h:4+(i%3)*3}px"></i>`).join('')}</div></div><h2 class="h-subtitle" style="text-align:center">${state.voice?'Go on. I’m here.':state.voiceFinished?'A little clearer already.':'What’s on your mind?'}</h2><p class="h-small" style="text-align:center;margin:11px 0 22px">${state.voice?'Simulated listening · microphone is off':state.voiceFinished?'Sample reflection saved in this preview':'Voice preview · no microphone access'}</p>${button(I(state.voice?'square':'mic')+' '+(state.voice?'Finish thought':'Start talking'),state.voice?'voice-stop':'voice-start','h-primary h-full')}<div class="h-section"><h2>Pick up a thread</h2></div><button class="h-goal" data-act="reflection"><span><b>Making room for side projects</b><span class="h-small">Yesterday · a 3-minute reflection</span></span>${I('arrow-up-right')}</button>`}
function north(){return `${top('North Star · The long view')}<h1 class="h-title">Small steps.<br><em>True direction.</em></h1><div class="h-north-orbit" aria-hidden="true"><span class="h-orbit-line"></span><span class="h-orbit-line"></span><span class="h-north-core">${I('sparkles')}</span></div><p class="h-body" style="text-align:center;margin-bottom:25px">Build a life with room to create,<br>strength to explore, and people you love.</p>${[['Build something of my own','Today’s task moves this forward'],['Stay strong for the long run','Strength A · planned for today'],['Show up for my people','Make room this weekend']].map(([title,sub],i)=>`<button class="h-goal" data-act="goal-${i}"><span><b>${title}</b><span class="h-small">${sub}</span></span>${I('arrow-up-right')}</button>`).join('')}`}
function me(){return `${top('Me · Your space')}<div class="h-avatar" style="width:64px;height:64px;display:grid;place-items:center;font-size:36px;margin:10px 0 19px">J</div><h1 class="h-title">A little more<br><em>like you.</em></h1><p class="h-body">Your preferences, memories, and connections.</p><div class="h-section"><h2>What Habits knows</h2></div>${[['Food & cooking','Korean, Japanese · efficient meal prep','taste'],['Training','Strength, golf & steady progress','program'],['Calendar','Google Calendar · sample connection','calendar'],['Assistant memory','You choose what stays','memory'],['Appearance',design.appearance==='auto'?'Follows your device':design.appearance==='ink'?'Deep ink':'Soft pearl','appearance']].map(([title,sub,act])=>`<button class="h-goal" data-act="${act}"><span><b>${title}</b><span class="h-small">${sub}</span></span>${I('chevron-right')}</button>`).join('')}<div class="h-notice">${I('laptop')}<span>Designed for your personal Mac server.<br>This prototype runs entirely on sample data.</span></div>`}
function openSheet(title,body){toastEl.hidden=true;clearTimeout(toastTimer);lastFocus=document.activeElement;stage.inert=true;root.querySelector('.h-footer').inert=true;layer.hidden=false;layer.innerHTML=`<section class="h-sheet" role="dialog" aria-modal="true" aria-label="${title.replace(/<[^>]*>/g,' ')}"><button class="h-sheet-handle" data-act="close" aria-label="Close sheet"></button><div class="h-sheet-head"><h2>${title}</h2>${button(I('x'),'close','h-icon','aria-label="Close"')}</div>${body}</section>`;icons();layer.querySelector('[data-act=close]').focus();}
function closeSheet(){layer.hidden=true;layer.innerHTML='';stage.inert=false;root.querySelector('.h-footer').inert=false;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();else if(lastFocus)nav.querySelector('[aria-current=page]')?.focus();lastFocus=null;}
function showAssistant(answer=false){state.assistantAnswer=answer;openSheet('A little help.',`<p class="h-body">${state.tab==='train'?'Your coach, right where you need it.':state.tab==='food'?'Meals, pantry, preferences. All in context.':'Make your day fit the life you want.'}</p>${answer?`<div class="h-assistant-answer"><strong>You have a busy day. Let’s make it lighter.</strong><p style="margin-top:8px">Shorten Strength A to 30 minutes, keep the main lifts, and leave dinner to your meal prep.</p></div>${button('Apply the 30-minute session','assistant-apply','h-primary h-full')}`:`<div class="h-options">${button('I only have 30 minutes','assistant-sample','')}${button('Help with dinner','assistant-dinner','')}</div><form id="habits-ask"><label class="h-small" for="habits-prompt">Ask your assistant</label><input id="habits-prompt" class="h-input" placeholder="What’s on your mind?" autocomplete="off"><button class="h-primary h-full" type="submit">Preview a reply ${I('arrow-up')}</button></form>`}<p class="h-small" style="margin-top:14px">Scripted preview · no message is sent</p>`)}
function adjust(){state.pendingMinutes=state.minutes;openSheet('Make today fit.',`<p class="h-body">Keep the main lifts. Adjust the time.</p><div class="h-options">${[20,30,45].map(n=>`<button data-minutes="${n}" aria-pressed="${state.minutes===n}">${n} minutes</button>`).join('')}</div><div class="h-assistant-answer" id="habits-adjust-preview">${state.minutes===45?'Your full session: 6 movements.':state.minutes===30?'Main lifts + one accessory. About 30 minutes.':'Main lifts only. About 20 minutes.'}</div>${button('Update today','save-adjust','h-primary h-full')}`)}
function payment(){if(state.paid){state.food='receipt';render();return}const s=stores[state.store];openSheet('One order.<br>Only with you.',`<div class="h-confirm-mark">${I('scan-face')}</div><p class="h-body">${s.name} · ${s.via}</p><div class="h-money" style="font-size:49px">${money(s.total)}</div><p class="h-body">Approve this reviewed basket once, using device authentication in the finished app.</p><div class="h-notice">${I('lock-keyhole')}<span>One use. Expires after approval. No automatic reorder or retry when an order’s status is uncertain.</span></div>${button('Simulate device approval','authorize','h-primary h-full')}${button('Keep reviewing','close','h-quiet h-full')}<p class="h-small">Simulation only. This does not invoke Face ID, charge a card, or place an order.</p>`)}
let deckBusy=false;
function chooseRecipe(keep){if(deckBusy)return;const card=stage.querySelector('.h-recipe');const reduced=design.motion==='quiet'||matchMedia('(prefers-reduced-motion: reduce)').matches;if(card&&!reduced){deckBusy=true;card.animate([{transform:'translateX(0) rotate(0deg)',opacity:1},{transform:'translateX('+(keep?'110':'-110')+'px) rotate('+(keep?'9':'-9')+'deg)',opacity:0}],{duration:190,easing:'ease-in',fill:'forwards'}).finished.then(()=>{deckBusy=false;commitRecipe(keep)});return}commitRecipe(keep)}
function commitRecipe(keep){if(state.deck>=meals.length||state.kept.length>=3)return;state.history.push({deck:state.deck,kept:[...state.kept]});if(keep)state.kept.push(state.deck);const label=meals[state.deck].title;do{state.deck++}while(state.kept.includes(state.deck));if(state.kept.length>=3){state.food='plan';announce('18 servings covered. Your plan is ready.')}else announce(keep?label+' kept. '+state.kept.length*6+' of 18 servings covered.':label+' skipped this time.');render();}
function undoRecipe(){const prev=state.history.pop();if(!prev)return;state.deck=prev.deck;state.kept=prev.kept;state.food='deck';render();announce('Last meal choice undone.')}
function toggleHabit(i){const previous=state.habits[i];state.habits[i]=!previous;render(false);toast(previous?'Ritual marked incomplete':'A good thing, done.',()=>{state.habits[i]=previous;render(false)})}
function clearRest(){clearInterval(restTimer);restTimer=null;state.rest=0}
function startRest(){clearRest();state.rest=90;restTimer=setInterval(()=>{state.rest=Math.max(0,state.rest-1);const el=root.querySelector('#habits-rest');if(el)el.textContent=state.rest+'s';if(!state.rest){clearRest();render(false);announce('Rest complete. Ready for your next set.')}},1000)}
function goTab(tab){closeSheet();state.tab=tab;toastEl.hidden=true;render();announce(tabs.find(t=>t[0]===tab)[2]+' screen')}
function act(a){
 if(a==='close'){closeSheet();return}if(a==='toast-close'){toastEl.hidden=true;return}if(a==='undo'){const fn=undoAction;undoAction=null;toastEl.hidden=true;if(fn)fn();return}
 if(a==='profile'){goTab('me');return}if(a==='assistant'){showAssistant();return}if(a==='assistant-sample'){showAssistant(true);return}if(a==='assistant-dinner'){closeSheet();goTab('food');return}if(a==='assistant-apply'){state.minutes=30;closeSheet();render(false);toast('Today’s session is now 30 minutes.');return}
 if(a==='adjust'){adjust();return}if(a==='save-adjust'){state.minutes=state.pendingMinutes;if(state.exercise>=movementCount()){state.exercise=movementCount()-1;state.sets=0;clearRest()}closeSheet();render(false);toast('Your session now fits '+state.minutes+' minutes.');return}
 if(a==='start-workout'){state.tab='train';state.session=true;render();announce('Workout open. Log your first set.');return}if(a==='leave-workout'){state.session=false;render();return}
 if(a==='weight-up'||a==='weight-down'){state.weight=Math.max(5,state.weight+(a.endsWith('up')?5:-5));render(false);return}if(a==='reps-up'||a==='reps-down'){state.reps=Math.max(1,state.reps+(a.endsWith('up')?1:-1));render(false);return}
 if(a==='log-set'){if(state.rest||state.sets>=3)return;state.sets++;if(state.sets<3)startRest();render(false);const logged=state.sets;toast('Set '+logged+' logged · '+state.weight+' lb × '+state.reps,()=>{clearRest();state.sets=logged-1;render(false)});return}
 if(a==='skip-rest'){clearRest();render(false);return}if(a==='next-exercise'){if(state.exercise===movementCount()-1){clearRest();state.session=false;state.exercise=0;state.sets=0;render();toast('Session complete. Nice work.');return}state.exercise++;state.sets=0;clearRest();render();return}
 if(a==='task'){state.task=!state.task;render(false);toast(state.task?'One meaningful thing, done.':'Task reopened.',()=>{state.task=!state.task;render(false)});return}
 if(a.startsWith('food-')){let next=a.slice(5);if(next==='deck'&&state.kept.length>=3)next='plan';state.food=next;render();return}

root.addEventListener('click',e=>{if(performance.now()<suppressUntil){e.preventDefault();return}const t=e.target.closest('button');if(!t)return;if(t.dataset.tab){goTab(t.dataset.tab);return}if(t.dataset.habit!==undefined){toggleHabit(Number(t.dataset.habit));return}if(t.dataset.pantry!==undefined){const i=Number(t.dataset.pantry);const values=['Have','Low','Need'];state.pantry[i]=values[(values.indexOf(state.pantry[i])+1)%3];render(false);announce(t.getAttribute('aria-label').split(':')[0]+' marked '+state.pantry[i]);return}if(t.dataset.day!==undefined){state.selectedDay=Number(t.dataset.day);render(false);return}if(t.dataset.store!==undefined){state.store=Number(t.dataset.store);state.cartReady=false;render(false);return}if(t.dataset.minutes){state.pendingMinutes=Number(t.dataset.minutes);layer.querySelectorAll('[data-minutes]').forEach(b=>b.setAttribute('aria-pressed',b===t));layer.querySelector('#habits-adjust-preview').textContent=state.pendingMinutes===45?'Your full session: 6 movements.':state.pendingMinutes===30?'Main lifts + one accessory. About 30 minutes.':'Main lifts only. About 20 minutes.';return}if(t.dataset.appearance){design.appearance=t.dataset.appearance;applyDesign();layer.querySelectorAll('[data-appearance]').forEach(b=>b.setAttribute('aria-pressed',b===t));render(false);return}if(t.dataset.taste){state.taste[['Korean','Japanese','One-pot meals','New flavors'].indexOf(t.dataset.taste)]=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');announce('Preference changed in preview.');return}if(t.dataset.act)act(t.dataset.act)});
root.addEventListener('submit',e=>{if(e.target.id==='habits-ask'){e.preventDefault();const value=e.target.querySelector('input').value.trim();if(!value){e.target.querySelector('input').focus();return}showAssistant(true)}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!layer.hidden){e.preventDefault();closeSheet()}if(e.key==='Tab'&&!layer.hidden){const focusable=[...layer.querySelectorAll('button:not(:disabled),a[href],input')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
root.addEventListener('pointerdown',e=>{const target=e.target.closest('[data-habit],[data-deck],[data-hold],.h-sheet-handle');if(!target||e.button!==0)return;if(target.hasAttribute('data-hold')&&e.target.closest('button')&&e.target.closest('button')!==target)return;gesture={target,x:e.clientX,y:e.clientY,dx:0,dy:0,held:false,timer:null};const g=gesture;try{target.setPointerCapture(e.pointerId)}catch{}if(target.dataset.habit!==undefined||target.dataset.hold){g.timer=setTimeout(()=>{if(gesture!==g)return;g.held=true;suppressUntil=performance.now()+500;act(target.dataset.hold||'habit-options-'+target.dataset.habit)},500)}});
root.addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture;g.dx=e.clientX-g.x;g.dy=e.clientY-g.y;if(Math.abs(g.dx)>9||Math.abs(g.dy)>9)clearTimeout(g.timer);if(g.held)return;if(g.target.matches('.h-sheet-handle'))return;if((g.target.dataset.habit!==undefined||g.target.dataset.deck)&&Math.abs(g.dx)>Math.abs(g.dy)&&Math.abs(g.dx)>8){g.target.style.transition='none';g.target.style.transform=`translateX(${Math.max(-125,Math.min(125,g.dx))}px) rotate(${g.target.dataset.deck?g.dx/19:0}deg)`}});
root.addEventListener('pointerup',e=>{if(!gesture)return;const g=gesture;g.dx=e.clientX-g.x;g.dy=e.clientY-g.y;gesture=null;clearTimeout(g.timer);g.target.style.transition='';g.target.style.transform='';if(g.held){suppressUntil=performance.now()+400;return}if(g.target.matches('.h-sheet-handle')&&g.dy>65){suppressUntil=performance.now()+400;closeSheet();return}if(Math.abs(g.dx)>65&&Math.abs(g.dx)>Math.abs(g.dy)*1.3){suppressUntil=performance.now()+400;if(g.target.dataset.habit!==undefined)toggleHabit(Number(g.target.dataset.habit));if(g.target.dataset.deck)chooseRecipe(g.dx>0)}});
root.addEventListener('pointercancel',()=>{if(gesture){clearTimeout(gesture.timer);gesture.target.style.transform='';gesture.target.style.transition='';gesture=null}});

root.addEventListener('click',e=>{const b=e.target.closest('[data-tp-view]');if(!b||performance.now()<suppressUntil)return;state.trainView=b.dataset.tpView;render(false);touchCue('Selection tick',b.textContent)});
root.addEventListener('change',e=>{if(!e.target.matches('[data-tp-five]'))return;state.programFive=e.target.checked;render(false);root.querySelector('[data-tp-five]')?.focus();touchCue('Light impact','Weekly session preference updated')});

// Keep the approved information architecture; refine continuity and touch response.
design.cues=false;
const craftAnimations=new Set(),craftDetails=new Map(),craftDetailAnimations=new WeakMap();
let craftPage=null,craftChartDay=94,craftKeyboard=false,craftGhost=null,craftSheetGesture=null;
const craftReduced=matchMedia('(prefers-reduced-motion: reduce)');
const craftMoves=()=>design.motion!=='quiet'&&!craftReduced.matches&&!craftKeyboard;
function craftAnimate(el,frames,options){
 if(!el||!craftMoves())return null;
 const a=el.animate(frames,options);craftAnimations.add(a);
 a.finished.then(()=>craftAnimations.delete(a),()=>craftAnimations.delete(a));return a;
}
root.addEventListener('keydown',()=>{craftKeyboard=true;root.dataset.input='keyboard'},true);
root.addEventListener('pointerdown',()=>{craftKeyboard=false;root.dataset.input='pointer'},true);
function craftStop(){for(const a of craftAnimations)a.cancel();craftAnimations.clear()}
craftReduced.addEventListener('change',()=>{if(craftReduced.matches)craftStop()});
const craftPreviousDesign=applyDesign;
applyDesign=function(){craftPreviousDesign();if(design.motion==='quiet')craftStop()};
function craftDetailKey(el){return el.dataset.craftDetail||null}
function craftCaptureDetails(){root.querySelectorAll('[data-craft-detail]').forEach(d=>{craftDetails.set(craftDetailKey(d),craftDetailAnimations.get(d)?.target??d.open)})}
function craftArrange(){
 const view=root.querySelector('.ns-active-view');
 if(state.tab==='north'&&state.north==='compound'&&view){
  const heading=view.querySelector('.ns-heading'),summary=view.querySelector('.ns-composite-summary'),tools=view.querySelector('.ns-chart-tools'),unit=tools.querySelector('.ns-unit-label'),modes=view.querySelector('.ns-modes'),chart=view.querySelector('[data-chart]');
  heading.after(summary);summary.after(tools);
  const secondary=document.createElement('div');secondary.className='craft-chart-controls';secondary.append(modes,unit);chart.after(secondary);
 }
 const tp=root.querySelector('.tp-nav');
 if(tp){const well=document.createElement('div');well.className='craft-tp-well';well.setAttribute('aria-hidden','true');well.style.transform=`translateX(${tpViews.indexOf(state.trainView)*100}%)`;tp.prepend(well)}
 root.querySelectorAll('.tp-phase').forEach((d,i)=>{d.dataset.craftDetail='program-phase-'+i;d.open=craftDetails.get(d.dataset.craftDetail)??false});
 root.querySelectorAll('[data-ns-target]').forEach(d=>{d.dataset.craftDetail='north-target-'+d.dataset.nsTarget;if(craftDetails.has(d.dataset.craftDetail))d.open=craftDetails.get(d.dataset.craftDetail)});
 const input=root.querySelector('[data-tp-five]');
 if(input){const control=document.createElement('span');control.className='craft-switch-control';input.before(control);control.append(input);const track=document.createElement('span');track.className='craft-switch-track';track.setAttribute('aria-hidden','true');control.append(track)}
}
const craftPreviousRender=render;
render=function(animate=true){
 craftCaptureDetails();
 const oldNorth=root.querySelector('.ns-nav-well'),oldTrain=root.querySelector('.craft-tp-well');
 const northTransform=oldNorth?getComputedStyle(oldNorth).transform:null,trainTransform=oldTrain?getComputedStyle(oldTrain).transform:null;
 const skyTimes=[...root.querySelectorAll('.ns-photo')].map(el=>el.getAnimations()[0]?.currentTime??0);
 const oldChart=root.querySelector('[data-chart=full]');if(oldChart&&nsCharts.has(oldChart))craftChartDay=nsCharts.get(oldChart).focus;
 const page=state.tab==='north'?'north/'+state.north:state.tab==='train'?'train/'+(state.session?'session':state.trainView):state.tab==='food'?'food/'+state.food:state.tab;
 const previousPage=craftPage;craftPage=page;
 craftPreviousRender(false);craftArrange();
 root.querySelectorAll('.ns-photo').forEach((el,i)=>{const a=el.getAnimations()[0];if(a&&skyTimes[i]!=null)a.currentTime=skyTimes[i]});
 const chart=root.querySelector('[data-chart=full]');if(chart){drawChart(chart);paintChartFocus(chart,craftChartDay,false)}
 for(const [selector,from] of [['.ns-nav-well',northTransform],['.craft-tp-well',trainTransform]]){const el=root.querySelector(selector);if(el&&from&&from!=='none')craftAnimate(el,[{transform:from},{transform:getComputedStyle(el).transform}],{duration:220,easing:'cubic-bezier(.32,.72,0,1)'})}
 if(previousPage&&previousPage!==page){const content=root.querySelector(state.tab==='north'?'.ns-active-view':'.h-stage>div');craftAnimate(content,[{opacity:.72,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:170,easing:'cubic-bezier(.22,1,.36,1)'})}
};
root.addEventListener('click',e=>{
 const summary=e.target.closest('summary');if(!summary)return;const d=summary.parentElement;if(!d.matches('[data-craft-detail]')||!craftMoves())return;
 e.preventDefault();const current=craftDetailAnimations.get(d),target=current?!current.target:!d.open,start=d.getBoundingClientRect().height;
 current?.animation.cancel();d.open=true;d.style.height='auto';const full=d.getBoundingClientRect().height,end=target?full:summary.getBoundingClientRect().height;
 d.style.overflow='hidden';const a=craftAnimate(d,[{height:start+'px'},{height:end+'px'}],{duration:210,easing:'cubic-bezier(.22,1,.36,1)'});
 if(!a){d.open=target;d.style.overflow='';return}const record={animation:a,target};craftDetailAnimations.set(d,record);craftDetails.set(craftDetailKey(d),target);
 const finish=()=>{if(craftDetailAnimations.get(d)!==record)return;d.open=target;d.style.height='';d.style.overflow='';craftDetailAnimations.delete(d)};a.finished.then(finish,finish);
},true);
root.addEventListener('toggle',e=>{const d=e.target;if(d.matches?.('[data-craft-detail]')&&!craftDetailAnimations.has(d))craftDetails.set(craftDetailKey(d),d.open)},true);
const craftPreviousOpen=openSheet,craftPreviousClose=closeSheet;
function craftRemoveGhost(){craftGhost?.remove();craftGhost=null}
openSheet=function(title,body){craftRemoveGhost();craftPreviousOpen(title,body)};
closeSheet=function(){
 const sheet=layer.querySelector('.h-sheet'),startTransform=sheet?getComputedStyle(sheet).transform:'none';const exitY=(startTransform==='none'?0:new DOMMatrixReadOnly(startTransform).m42)+80;let ghost=null;
 if(sheet&&!layer.hidden&&craftMoves()){
  craftRemoveGhost();ghost=layer.cloneNode(true);ghost.classList.add('craft-sheet-ghost');ghost.setAttribute('aria-hidden','true');ghost.inert=true;ghost.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));root.querySelector('.h-phone').append(ghost);craftGhost=ghost;
 }
 craftPreviousClose();
 if(ghost){const panel=ghost.querySelector('.h-sheet');panel.style.animation='none';craftAnimate(ghost,[{opacity:1},{opacity:0}],{duration:180,easing:'ease-out'});const a=craftAnimate(panel,[{transform:startTransform==='none'?'translateY(0)':startTransform},{transform:`translateY(${exitY}px)`}],{duration:180,easing:'cubic-bezier(.4,0,1,1)'});const cleanup=()=>{ghost.remove();if(craftGhost===ghost)craftGhost=null};if(a)a.finished.then(cleanup,cleanup);else cleanup()}
};
// Direct manipulation is limited to the handle, so sheet contents remain scrollable.
root.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('.h-sheet-handle');if(!handle||!layer.contains(handle)||e.button!==0)return;
 e.stopImmediatePropagation();if(craftSheetGesture)return;
 const panel=handle.closest('.h-sheet');panel.getAnimations().forEach(a=>a.cancel());craftSheetGesture={id:e.pointerId,handle,panel,start:e.clientY,last:e.clientY,lastTime:performance.now(),velocity:0,dy:0};handle.setPointerCapture(e.pointerId);
},true);
root.addEventListener('pointermove',e=>{
 const g=craftSheetGesture;if(!g||e.pointerId!==g.id)return;e.stopImmediatePropagation();const now=performance.now(),dt=now-g.lastTime;
 if(dt>0)g.velocity=(e.clientY-g.last)/dt;g.last=e.clientY;g.lastTime=now;g.dy=e.clientY-g.start;
 const travel=g.dy>=0?g.dy:g.dy*.14;g.panel.style.transform=`translateY(${travel}px)`;
},true);
function craftRelease(e,cancelled){
 const g=craftSheetGesture;if(!g||e.pointerId!==g.id)return;e.stopImmediatePropagation();craftSheetGesture=null;
 const moved=Math.abs(g.dy)>6;if(moved)suppressUntil=performance.now()+320;
 const releaseVelocity=performance.now()-g.lastTime<80?g.velocity:0;
 if(!cancelled&&(g.dy>65||(g.dy>24&&releaseVelocity>.65))){closeSheet();touchCue('Soft impact','Sheet closed');return}
 const from=g.panel.style.transform;g.panel.style.transform='';if(moved)craftAnimate(g.panel,[{transform:from},{transform:'translateY(0)'}],{duration:220,easing:'cubic-bezier(.32,.72,0,1)'});
}
root.addEventListener('pointerup',e=>craftRelease(e,false),true);
root.addEventListener('pointercancel',e=>craftRelease(e,true),true);

render(false);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'appearance',{label:'Appearance',options:[{label:'Follow device',value:'auto'},{label:'Pearl',value:'pearl'},{label:'Ink',value:'ink'}]});tweak.addSelect(design,'motion',{label:'Motion',options:[{label:'Fluid',value:'fluid'},{label:'Quiet',value:'quiet'}]});tweak.addToggle(design,'aurora',{label:'Aurora motion'});tweak.addSelect(design,'hero',{label:'Aurora framing',options:[{label:'Immersive',value:'immersive'},{label:'Compact',value:'compact'}]});tweak.addToggle(design,'cues',{label:'Show haptic cues'});}
})();
</script>
