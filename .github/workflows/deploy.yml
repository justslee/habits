name: Deploy backend (SSM)

# Auto-deploy the Habits FastAPI backend to the shared EC2 box on merge to main.
# Uses AWS SSM Run-Command — no SSH, no open port 22, no Console. The box pulls
# the new code and restarts the service; uvicorn stays loopback-only (127.0.0.1:8001)
# behind nginx + the ALB. Cleanly separate from scorecard-api (:8000).
#
# One-time setup: add repo secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
# (an IAM user with ssm:SendCommand + ssm:GetCommandInvocation on the instance),
# and run backend/ops/bootstrap.sh once on the box to create the DB + service.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-habits-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-0826ae70df62d9fe8

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run-Command
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy-habits ${GITHUB_SHA::7}" \
            --parameters 'commands=[
              "set -eu",
              "su - ubuntu -c \"cd ~/habits && git pull --ff-only && cd backend && ~/.local/bin/uv pip install --python .venv/bin/python -r requirements.txt\"",
              "su - ubuntu -c \"cd ~/habits/backend && set -a && . .env && set +a && .venv/bin/alembic upgrade head\"",
              "systemctl restart habits-api",
              "for i in $(seq 1 15); do curl -fsS http://localhost:8001/health && exit 0; sleep 2; done; echo health check timed out after 30s >&2; exit 1"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ]
